server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 20m;

    # 说明：外层 nginx 通过 `proxy_pass http://127.0.0.1:8091/;` 反代 /babyBook/
    # 末尾斜杠会剥掉 /babyBook 前缀，因此容器收到的路径是 / 开头。
    # 浏览器侧资源是绝对路径 /babyBook/assets/*，外层 nginx 会再次路由到此容器并剥成 /assets/*
    # 故此处只需按根路径提供静态文件即可。

    # 静态资源长期缓存（文件名带 hash）
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 禁用缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA 路由回退
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
